# Catppuccin Latte theme for the Beef IDE
# Palette: https://catppuccin.com/palette (Latte)
#
#   rosewater DC8A78  flamingo  DD7878  pink      EA76CB  mauve     8839EF
#   red       D20F39  maroon    E64553  peach     FE640B  yellow    DF8E1D
#   green     40A02B  teal      179299  sky       04A5E5  sapphire  209FB5
#   blue      1E66F5  lavender  7287FD
#   text      4C4F69  subtext1  5C5F77  subtext0  6C6F85
#   overlay2  7C7F93  overlay1  8C8FA1  overlay0  9CA0B0
#   surface2  ACB0BE  surface1  BCC0CC  surface0  CCD0DA
#   base      EFF1F5  mantle    E6E9EF  crust     DCE0E8
#
# Colors are 0xAARRGGBB. Generated by ../make_themes.py, along with the UI images (UI*.png).
# Syntax follows catppuccin/nvim: keywords mauve, types yellow, methods blue, strings green,
# numbers and booleans peach, value types (structs, enums, primitives) teal, other types yellow,
# fields and namespaces lavender, parameters maroon, comments overlay2.
# The icon atlas uses saturation-boosted accents so breakpoints stand out.

[Colors]
# UI
Text = 0xFF4C4F69
TextDisabled = 0xFF8C8FA1
TextSelected = 0xFFBCC0CC
Window = 0xFFDCDFE6
DialogOutlineIn = 0xFFBCC0CC
DialogOutlineOut = 0xFF9CA0B0
Grid = 0x0C4C4F69
Background = 0xFFDCE0E8
SelectedOutline = 0xFF7287FD
MenuFocused = 0xFF8839EF
MenuSelected = 0xFF7C7F93
AutoCompleteSubText = 0xFF6C6F85
AutoCompleteDocText = 0xFF5C5F77
AutoCompleteActiveText = 0xFF7287FD
WorkspaceDisabledText = 0xFF8C8FA1
WorkspaceFailedText = 0xFFD20F39
WorkspaceManualIncludeText = 0xFF7287FD
WorkspaceIgnoredText = 0xFF9CA0B0

# Code
Code = 0xFF4C4F69
Keyword = 0xFF8839EF
Literal = 0xFF40A02B
Number = 0xFFFE640B
Identifier = 0xFF4C4F69
Local = 0xFF4C4F69
Parameter = 0xFFE64553
Member = 0xFF7287FD
Static = 0xFF7287FD
Method = 0xFF1E66F5
Comment = 0xFF7C7F93
Type = 0xFFDF8E1D
PrimitiveType = 0xFF179299
Struct = 0xFF179299
RefType = 0xFFDF8E1D
Interface = 0xFFDF8E1D
GenericParam = 0xFFDF8E1D
Namespace = 0xFF7287FD

# Debugger / output
DisassemblyText = 0xFF6C6F85
DisassemblyFileName = 0xFF1E66F5
Error = 0xFFD20F39
BuildText = 0xFF8C8FA1
BuildError = 0xFFD20F39
BuildWarning = 0xFFDF8E1D
