VisibleWhiteSpace = 0xFFBCC0CC

# Editor highlights
CurrentLineHilite = 0xFFCCD0DA
CurrentLineNumberHilite = 0x184C4F69
CharPairHilite = 0x304C4F69
CodeHilite = 0xFFBCC0CC
CodeHiliteUnfocused = 0x80BCC0CC
