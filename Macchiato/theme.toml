# Catppuccin Macchiato theme for the Beef IDE
# Palette: https://catppuccin.com/palette (Macchiato)
#
#   rosewater F4DBD6  flamingo  F0C6C6  pink      F5BDE6  mauve     C6A0F6
#   red       ED8796  maroon    EE99A0  peach     F5A97F  yellow    EED49F
#   green     A6DA95  teal      8BD5CA  sky       91D7E3  sapphire  7DC4E4
#   blue      8AADF4  lavender  B7BDF8
#   text      CAD3F5  subtext1  B8C0E0  subtext0  A5ADCB
#   overlay2  939AB7  overlay1  8087A2  overlay0  6E738D
#   surface2  5B6078  surface1  494D64  surface0  363A4F
#   base      24273A  mantle    1E2030  crust     181926
#
# Colors are 0xAARRGGBB. Generated by ../make_themes.py, along with the UI images (UI*.png).
# Syntax follows catppuccin/nvim: keywords mauve, types yellow, methods blue, strings green,
# numbers and booleans peach, value types (structs, enums, primitives) teal, other types yellow,
# fields and namespaces lavender, parameters maroon, comments overlay2.
# The icon atlas uses saturation-boosted accents so breakpoints stand out.

[Colors]
# UI
Text = 0xFFCAD3F5
TextDisabled = 0xFF8087A2
TextSelected = 0xFF494D64
Window = 0xFF2E3146
DialogOutlineIn = 0xFF494D64
DialogOutlineOut = 0xFF181926
Grid = 0x0CCAD3F5
Background = 0xFF181926
SelectedOutline = 0xFFB7BDF8
MenuFocused = 0xFFC6A0F6
MenuSelected = 0xFF939AB7
AutoCompleteSubText = 0xFFA5ADCB
AutoCompleteDocText = 0xFFB8C0E0
AutoCompleteActiveText = 0xFFB7BDF8
WorkspaceDisabledText = 0xFF8087A2
WorkspaceFailedText = 0xFFED8796
WorkspaceManualIncludeText = 0xFFB7BDF8
WorkspaceIgnoredText = 0xFF6E738D

# Code
Code = 0xFFCAD3F5
Keyword = 0xFFC6A0F6
Literal = 0xFFA6DA95
Number = 0xFFF5A97F
Identifier = 0xFFCAD3F5
Local = 0xFFCAD3F5
Parameter = 0xFFEE99A0
Member = 0xFFB7BDF8
Static = 0xFFB7BDF8
Method = 0xFF8AADF4
Comment = 0xFF939AB7
Type = 0xFFEED49F
PrimitiveType = 0xFF8BD5CA
Struct = 0xFF8BD5CA
RefType = 0xFFEED49F
Interface = 0xFFEED49F
GenericParam = 0xFFEED49F
Namespace = 0xFFB7BDF8

# Debugger / output
DisassemblyText = 0xFFA5ADCB
DisassemblyFileName = 0xFF8AADF4
Error = 0xFFED8796
BuildText = 0xFF8087A2
BuildError = 0xFFED8796
BuildWarning = 0xFFEED49F
BuildSuccess = 0xFFA6DA95
VisibleWhiteSpace = 0xFF494D64

# Editor highlights
CurrentLineHilite = 0xFF363A4F
CurrentLineNumberHilite = 0x18CAD3F5
CharPairHilite = 0x30CAD3F5
CodeHilite = 0xFF494D64
CodeHiliteUnfocused = 0x80494D64
