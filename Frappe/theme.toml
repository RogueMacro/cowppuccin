# Catppuccin Frappe theme for the Beef IDE
# Palette: https://catppuccin.com/palette (Frappe)
#
#   rosewater F2D5CF  flamingo  EEBEBE  pink      F4B8E4  mauve     CA9EE6
#   red       E78284  maroon    EA999C  peach     EF9F76  yellow    E5C890
#   green     A6D189  teal      81C8BE  sky       99D1DB  sapphire  85C1DC
#   blue      8CAAEE  lavender  BABBF1
#   text      C6D0F5  subtext1  B5BFE2  subtext0  A5ADCE
#   overlay2  949CBB  overlay1  838BA7  overlay0  737994
#   surface2  626880  surface1  51576D  surface0  414559
#   base      303446  mantle    292C3C  crust     232634
#
# Colors are 0xAARRGGBB. Generated by ../make_themes.py, along with the UI images (UI*.png).
# Syntax follows catppuccin/nvim: keywords mauve, types yellow, methods blue, strings green,
# numbers and booleans peach, value types (structs, enums, primitives) teal, other types yellow,
# fields and namespaces lavender, parameters maroon, comments overlay2.
# The icon atlas uses saturation-boosted accents so breakpoints stand out.

[Colors]
# UI
Text = 0xFFC6D0F5
TextDisabled = 0xFF838BA7
TextSelected = 0xFF51576D
Window = 0xFF393D50
DialogOutlineIn = 0xFF51576D
DialogOutlineOut = 0xFF232634
Grid = 0x0CC6D0F5
Background = 0xFF232634
SelectedOutline = 0xFFBABBF1
MenuFocused = 0xFFCA9EE6
MenuSelected = 0xFF949CBB
AutoCompleteSubText = 0xFFA5ADCE
AutoCompleteDocText = 0xFFB5BFE2
AutoCompleteActiveText = 0xFFBABBF1
WorkspaceDisabledText = 0xFF838BA7
WorkspaceFailedText = 0xFFE78284
WorkspaceManualIncludeText = 0xFFBABBF1
WorkspaceIgnoredText = 0xFF737994

# Code
Code = 0xFFC6D0F5
Keyword = 0xFFCA9EE6
Literal = 0xFFA6D189
Number = 0xFFEF9F76
Identifier = 0xFFC6D0F5
Local = 0xFFC6D0F5
Parameter = 0xFFEA999C
Member = 0xFFBABBF1
Static = 0xFFBABBF1
Method = 0xFF8CAAEE
Comment = 0xFF949CBB
Type = 0xFFE5C890
PrimitiveType = 0xFF81C8BE
Struct = 0xFF81C8BE
RefType = 0xFFE5C890
Interface = 0xFFE5C890
GenericParam = 0xFFE5C890
Namespace = 0xFFBABBF1

# Debugger / output
DisassemblyText = 0xFFA5ADCE
