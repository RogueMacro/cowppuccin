# Catppuccin Mocha theme for the Beef IDE
# Palette: https://catppuccin.com/palette (Mocha)
#
#   rosewater F5E0DC  flamingo  F2CDCD  pink      F5C2E7  mauve     CBA6F7
#   red       F38BA8  maroon    EBA0AC  peach     FAB387  yellow    F9E2AF
#   green     A6E3A1  teal      94E2D5  sky       89DCEB  sapphire  74C7EC
#   blue      89B4FA  lavender  B4BEFE
#   text      CDD6F4  subtext1  BAC2DE  subtext0  A6ADC8
#   overlay2  9399B2  overlay1  7F849C  overlay0  6C7086
#   surface2  585B70  surface1  45475A  surface0  313244
#   base      1E1E2E  mantle    181825  crust     11111B
#
# Colors are 0xAARRGGBB. Generated by ../make_themes.py, along with the UI images (UI*.png).
# Syntax follows catppuccin/nvim: keywords mauve, types yellow, methods blue, strings green,
# numbers and booleans peach, value types (structs, enums, primitives) teal, other types yellow,
# fields and namespaces lavender, parameters maroon, comments overlay2.
# The icon atlas uses saturation-boosted accents so breakpoints stand out.

[Colors]
# UI
Text = 0xFFCDD6F4
TextDisabled = 0xFF7F849C
TextSelected = 0xFF45475A
Window = 0xFF28293A
DialogOutlineIn = 0xFF45475A
DialogOutlineOut = 0xFF11111B
Grid = 0x0CCDD6F4
Background = 0xFF11111B
SelectedOutline = 0xFFB4BEFE
MenuFocused = 0xFFCBA6F7
MenuSelected = 0xFF9399B2
AutoCompleteSubText = 0xFFA6ADC8
AutoCompleteDocText = 0xFFBAC2DE
AutoCompleteActiveText = 0xFFB4BEFE
WorkspaceDisabledText = 0xFF7F849C
WorkspaceFailedText = 0xFFF38BA8
WorkspaceManualIncludeText = 0xFFB4BEFE
WorkspaceIgnoredText = 0xFF6C7086

# Code
Code = 0xFFCDD6F4
Keyword = 0xFFCBA6F7
Literal = 0xFFA6E3A1
Number = 0xFFFAB387
Identifier = 0xFFCDD6F4
Local = 0xFFCDD6F4
Parameter = 0xFFEBA0AC
Member = 0xFFB4BEFE
Static = 0xFFB4BEFE
Method = 0xFF89B4FA
Comment = 0xFF9399B2
Type = 0xFFF9E2AF
PrimitiveType = 0xFF94E2D5
Struct = 0xFF94E2D5
RefType = 0xFFF9E2AF
Interface = 0xFFF9E2AF
GenericParam = 0xFFF9E2AF
Namespace = 0xFFB4BEFE

# Debugger / output
DisassemblyText = 0xFFA6ADC8
DisassemblyFileName = 0xFF89B4FA
Error = 0xFFF38BA8
BuildText = 0xFF7F849C
BuildError = 0xFFF38BA8
BuildWarning = 0xFFF9E2AF
BuildSuccess = 0xFFA6E3A1
VisibleWhiteSpace = 0xFF45475A

# Editor highlights
CurrentLineHilite = 0xFF313244
CurrentLineNumberHilite = 0x18CDD6F4
CharPairHilite = 0x30CDD6F4
CodeHilite = 0xFF45475A
CodeHiliteUnfocused = 0x8045475A
